[package]
name = "utter"
version = "0.1.0"
description = "Utter - free, open source dictation for Windows"
authors = ["Utter contributors"]
license = "MIT"
repository = "https://github.com/aadityamittal1/utter"
edition = "2021"

[lib]
name = "utter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
whisper-rs = "0.16"
cpal = "0.18"
rubato = "5"
hound = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
keyring = "4"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
csv = "1"
regex = "1"
once_cell = "1"
parking_lot = "0.13"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_Media_Audio",
] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
