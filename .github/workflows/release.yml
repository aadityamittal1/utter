name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      # One at a time so the two jobs never race to create the same draft release.
      max-parallel: 1
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    # Both installers are built on an x64 runner (ARM64 is cross-compiled).
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Short target dir avoids Windows long-path link errors (LNK1104).
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne $version) {
            Write-Error "Tag '${{ github.ref_name }}' does not match tauri.conf.json version '$version'."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # Needed by whisper-rs bindgen. The runner's LLVM is x64, which is what the
      # build host needs even when cross-compiling to ARM64.
      - name: Install LLVM
        shell: pwsh
        run: |
          $bin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $bin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ARM64 leg only. whisper.cpp's ggml refuses MSVC for ARM ("MSVC is not
      # supported for ARM, use clang"), so build the C/C++ parts with clang-cl via
      # Ninja. The runner is x64 cross-compiling to ARM64: the cmake crate passes
      # --target=aarch64-pc-windows-msvc to clang-cl itself. The windows-latest
      # images ship Visual Studio Enterprise, which includes the ARM64 MSVC
      # toolset and libs that clang-cl links against.
      - name: Check MSVC ARM64 libs
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $libs = @(Get-ChildItem -Path (Join-Path $vs "VC\Tools\MSVC\*\lib\arm64") -Directory -ErrorAction SilentlyContinue)
          if ($libs.Count -eq 0) {
            Write-Error "MSVC ARM64 libs not found under '$vs\VC\Tools\MSVC\*\lib\arm64'. The runner image lacks the 'MSVC v143 - VS 2022 C++ ARM64/ARM64EC build tools' component (Microsoft.VisualStudio.Component.VC.Tools.ARM64). Install it or change the runner image."
            exit 1
          }
          Write-Host "Found ARM64 libs: $($libs[0].FullName)"

      - name: Set up clang-cl and Ninja for ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $llvm = Join-Path $env:ProgramFiles "LLVM\bin"
          @(
            "CMAKE_GENERATOR=Ninja",
            "CC=clang-cl",
            "CXX=clang-cl",
            # clang-cl needs exceptions enabled explicitly; the cmake crate drops MSVC's default /EHsc.
            # Newer MSVC STL headers (VS 18, MSVC 14.52+) reject clang older than 22 with STL1000;
            # the runner's LLVM can lag behind, so allow the mismatch (Microsoft's documented escape hatch).
            "CXXFLAGS=/EHsc /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH",
            "LIBCLANG_PATH=$llvm"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Utter v__VERSION__"
          releaseBody: "Unsigned Windows installers. SmartScreen may warn on first run: choose More info, then Run anyway. See CHANGELOG.md for what is new."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
